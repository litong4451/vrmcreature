plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.gradle.userdev' version '7.0.171'
}

version = '1.0.0'
group = 'com.example'

base {
    archivesName = 'vrmcreature'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
}

dependencies {
    implementation 'net.neoforged:neoforge:21.1.0'
    // glTF 解析库，用于读取 VRM(.glb) 的网格/顶点数据
    implementation 'de.javagl:jgltf-model:2.0.4'
}

neoForge {
    version = '21.1.0'
    runs {
        client { client() }
        server { server() }
        data { data() }
    }
    mods {
        vrmcreature {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
